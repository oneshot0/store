<article
  class="mt-6 flex h-110 w-72 flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm"
>
  <div class="h-2/3 w-full overflow-hidden bg-slate-100">
    <img [src]="product.images[0]" [alt]="product.title" class="h-full w-full object-cover" />
  </div>

  <div class="flex flex-1 flex-col gap-2 p-4">
    <h3
      class="min-h-10 text-sm font-semibold leading-5 text-black line-clamp-2"
      [title]="product.title"
    >
      {{ product.title | uppercase | reverse}}
    </h3>

    <span class="text-sm leading-5 text-slate-600">{{ product.description | slice:0:50 }}...</span>

    <p class="text-sm font-semibold text-black">{{ product.price | currency: 'S/  ': 'symbol': '1.2-2' }}</p>

    <span class="text-[11px] text-slate-400">{{ product.creationAt | timeAgo }}</span>

    <button
      type="button"
      class="mt-auto w-full rounded-lg bg-blue-700 px-4 py-2 text-sm font-semibold text-white transition hover:bg-blue-800"
      (click)="addToCartHandler()"
    >
      Agregar al carrito
    </button>
  </div>
</article>
