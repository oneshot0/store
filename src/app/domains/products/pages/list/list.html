<div class="flex space-x-4 mt-5">
  <div class="w-80">
    <ul>
      <li>
        <a routerLink="/" class="font-semibold" >All Categories</a>
      </li>
        @for (category of categories(); track $index) {
          <li>
            <a routerLink="/" [queryParams]="{ category_id: category.id }" >{{ category.name }}</a>
          </li>
        }
    </ul>
  </div>
  <div class="w-full mt-6 grid grid-cols-1 justify-items-center gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
    @for (product of products(); track $index) {
      <app-product [product]="product" (addToCart)="addToCart($event)" />
    }
  </div>


</div>
