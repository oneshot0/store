<div class="container mx-auto">
  <!-- Aquí se muestra el header con el carrito -->
  <app-header [cart]="cart()" (removeFromCart)="removeFromCart($event)" />

  <div class="grid grid-cols-4 gap-8 mt-5">
    @for (product of products(); track $index) {
      <app-product [product]="product" (addToCart)="addToCart($event)" />
    }
  </div>
</div>
